<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>顧客情報編集</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">顧客情報の編集</h2>
        <form id="update-form">
            <div class="form-group">
                <label>会社名:</label>
                <input type="text" class="form-control" id="companyName" required>
            </div>
            <div class="form-group">
                <label>業種:</label>
                <input type="text" class="form-control" id="industry" required>
            </div>
            <div class="form-group">
                <label>連絡先:</label>
                <input type="text" class="form-control" id="contact" required>
            </div>
            <div class="form-group">
                <label>所在地:</label>
                <input type="text" class="form-control" id="location" required>
            </div>
            <a id="back-btn" href="#" class="btn btn-secondary">戻る</a>
            <button type="submit" class="btn btn-primary">更新する</button>
        </form>
    </div>
    <script type="module">
        import config from '../config.js';

        const params = new URLSearchParams(window.location.search);
        const customerId = params.get('id');

        document.getElementById('back-btn').href = `/customer/detail.html?id=${customerId}`;

        fetch(`${config.apiUrl}/customer/${customerId}`)
            .then(res => res.json())
            .then(customer => {
                document.getElementById('companyName').value = customer.company_name;
                document.getElementById('industry').value = customer.industry;
                document.getElementById('contact').value = customer.contact;
                document.getElementById('location').value = customer.location;
            });

        document.getElementById('update-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                companyName: document.getElementById('companyName').value,
                industry: document.getElementById('industry').value,
                contact: document.getElementById('contact').value,
                location: document.getElementById('location').value,
            };
            fetch(`${config.apiUrl}/customer/${customerId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    alert('更新しました。');
                    window.location.href = `/customer/detail.html?id=${customerId}`;
                } else {
                    alert('更新に失敗しました。');
                }
            })
            .catch(err => console.error(err));
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
