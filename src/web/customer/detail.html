<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>顧客詳細</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h2 class="mb-4">顧客詳細</h2>
        <table class="table" id="detail-table"></table>
        <a href="/customer/list.html" class="btn btn-secondary">一覧に戻る</a>
        <a id="edit-btn" href="#" class="btn btn-primary">編集</a>
        <button id="delete-btn" class="btn btn-danger">削除</button>
    </div>
    <script type="module">
        import config from '../config.js';

        const params = new URLSearchParams(window.location.search);
        const customerId = params.get('id');

        fetch(`${config.apiUrl}/customer/${customerId}`)
            .then(res => res.json())
            .then(customer => {
                const table = document.getElementById('detail-table');
                table.innerHTML = `
    <tr><th>顧客ID</th><td>${customer.customer_id}</td></tr>
    <tr><th>会社名</th><td>${customer.company_name}</td></tr>
    <tr><th>業種</th><td>${customer.industry}</td></tr>
    <tr><th>連絡先</th><td>${customer.contact}</td></tr>
    <tr><th>所在地</th><td>${customer.location}</td></tr>
    <tr><th>登録日</th><td>${customer.created_date}</td></tr>
    <tr><th>更新日</th><td>${customer.updated_date}</td></tr>
`;
                document.getElementById('edit-btn').href = `/customer/update.html?id=${customerId}`;
            });

        document.getElementById('delete-btn').addEventListener('click', () => {
            if (confirm('削除していいですか？')) {
                fetch(`${config.apiUrl}/customer/${customerId}`, {
                    method: 'DELETE'
                })
                    .then(res => res.json())
                    .then(result => {
                        if (result.success) {
                            window.location.href = '/customer/list.html';
                        } else {
                            alert('削除に失敗しました。');
                        }
                    });
            }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
